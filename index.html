/* =========================================================
   COLOR THEMES — pick one in Backup and settings.
   Each theme only swaps the accent colors.
   ========================================================= */
:root[data-palette="olive"]{--accent:#566236;--accent-2:#6B7944;--accent-deep:#3A4222;--accent-soft:#E9ECDE;--accent-ink:#FFFFFF;--gold:#A2894F}
:root[data-palette="espresso"]{--accent:#5A3B2C;--accent-2:#73503E;--accent-deep:#3B251A;--accent-soft:#EFE6E0;--accent-ink:#FFFFFF;--gold:#B08E5C}
:root[data-palette="bordeaux"]{--accent:#7A2234;--accent-2:#923247;--accent-deep:#561523;--accent-soft:#F4E3E7;--accent-ink:#FFFFFF;--gold:#B0905E}
:root[data-palette="navy"]{--accent:#24365A;--accent-2:#344A74;--accent-deep:#16223B;--accent-soft:#E4E8F1;--accent-ink:#FFFFFF;--gold:#A98B55}
:root[data-palette="sage"]{--accent:#4F6B5C;--accent-2:#628171;--accent-deep:#33473C;--accent-soft:#E3ECE7;--accent-ink:#FFFFFF;--gold:#A88B5A}

  :root[data-palette="olive"]:not([data-theme="light"]){--accent:#AAB57D;--accent-2:#BBC593;--accent-deep:#C9D2A6;--accent-soft:#33362A;--accent-ink:#1B1D12}
  :root[data-palette="espresso"]:not([data-theme="light"]){--accent:#C9A285;--accent-2:#D6B398;--accent-deep:#E0C3AC;--accent-soft:#3A2F29;--accent-ink:#1E140E}

.palettes{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.palette-opt{display:grid;gap:8px;padding:10px;border-radius:18px;border:1px solid var(--line-strong);background:var(--surface);text-align:left;font-weight:500}
.palette-opt[aria-pressed="true"]{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
.palette-opt .pv{display:flex;height:34px;border-radius:999px;overflow:hidden}
.palette-opt .pv span{flex:1}
.palette-opt small{color:var(--muted);font-weight:400;font-size:12px;line-height:1.3}
*,*::before,*::after{box-sizing:border-box}
html{height:100%;scroll-padding-top:env(safe-area-inset-top,0px)}
body{height:100%;margin:0;color:var(--ink);font:400 15px/1.65 var(--sans);overflow:hidden;-webkit-font-smoothing:antialiased;
  background:var(--glow),var(--stone) center/1600px,var(--base),var(--bg)}
#root{height:100%}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px}
h1,h2,h3{font-family:var(--serif);font-weight:500;margin:0;line-height:1.05}
.muted{color:var(--muted)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}
.serif-i{font-family:var(--serif);font-style:italic;font-weight:500}
.glass{background:var(--glass);-webkit-backdrop-filter:blur(14px) saturate(1.1);backdrop-filter:blur(14px) saturate(1.1)}

/* ---------- shell: floating marble-glass sidebar ---------- */
.app{display:grid;grid-template-columns:236px minmax(0,1fr);height:100%;padding:16px 0 16px 16px;gap:8px}
.rail{display:flex;flex-direction:column;gap:4px;padding:28px 16px 20px;min-height:0;border-radius:var(--r-lg);border:1px solid var(--line);box-shadow:var(--shadow);
  background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px)}
.brand{display:flex;align-items:center;gap:10px;font-family:var(--serif);font-style:italic;font-weight:500;font-size:38px;line-height:1;padding:0 10px;color:var(--accent-deep)}
.arch-mark{width:22px;height:28px;border-radius:999px 999px 3px 3px;background:var(--accent);box-shadow:inset 0 0 0 3px var(--surface),0 0 0 1px var(--accent);flex:none}
.brand-rule{display:flex;align-items:center;gap:6px;margin:14px 12px 24px;color:var(--gold)}
.brand-rule::before,.brand-rule::after{content:"";height:1px;flex:1;background:currentColor;opacity:.6}
.brand-rule i{width:5px;height:5px;border-radius:50%;background:currentColor;display:block}
.navbtn{display:flex;align-items:center;gap:12px;width:100%;padding:10px 14px;border:0;background:none;border-radius:var(--pill);text-align:left;color:var(--muted);font-weight:500;font-size:15px;letter-spacing:.02em;transition:background .15s,color .15s}
.navbtn svg{width:19px;height:19px;flex:none;stroke-width:1.6}
.navbtn:hover{color:var(--ink);background:rgba(194,96,61,.07)}
.navbtn[aria-current="page"]{color:var(--accent-ink);background:var(--accent);font-weight:600;box-shadow:0 8px 18px -12px var(--accent)}
.navbtn[aria-current="page"] svg{stroke-width:2}
.navbtn .count{margin-left:auto;font-size:12px;opacity:.75;font-weight:600}
.navbtn .tag{margin-left:auto;font-size:10.5px;color:var(--accent);background:var(--accent-soft);border-radius:var(--pill);padding:1px 8px;line-height:17px}
.navbtn[aria-current="page"] .tag{background:var(--surface);color:var(--accent)}
.rail-foot{margin-top:auto;padding:14px 12px 0;border-top:1px dashed var(--line-strong);display:grid;gap:6px}
.rail-foot .who{font-size:13.5px}
.rail-foot .who b{font-weight:700}
.linkbtn{border:0;background:none;padding:0;color:var(--accent);text-align:left;font-size:13.5px;font-weight:600}
.linkbtn:hover{color:var(--accent-deep);text-decoration:underline;text-underline-offset:3px}
main{height:100%;overflow:auto;min-width:0;overscroll-behavior:contain}
.view{max-width:1220px;margin:0 auto;padding:30px 36px 56px}
.tabbar{display:none}

/* ---------- cute buttons, chips, fields ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:42px;padding:0 22px;border-radius:var(--pill);border:1px solid var(--line-strong);background:var(--surface);
  font-weight:500;font-size:14.5px;letter-spacing:.03em;white-space:nowrap;color:var(--ink);transition:background .15s,border-color .15s,color .15s}
.btn svg{width:17px;height:17px;stroke-width:1.8}
.btn:hover{border-color:var(--accent);color:var(--accent)}
.btn.primary,.btn.accent{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);box-shadow:0 10px 20px -14px rgba(110,40,15,.8)}
.btn.primary:hover,.btn.accent:hover{background:var(--accent-deep);border-color:var(--accent-deep);color:var(--accent-ink)}
.btn.ghost{border-color:transparent;background:transparent;box-shadow:none}
.btn.ghost:hover{background:var(--accent-soft)}
.btn.danger{color:var(--accent-deep)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn.sm{height:34px;padding:0 14px;font-size:13.5px}
.icon-btn{width:40px;height:40px;padding:0;border-radius:50%}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;margin:0 -2px 12px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;height:36px;padding:0 16px;border-radius:var(--pill);border:1px solid var(--line-strong);background:var(--surface);color:var(--ink);font-weight:500;letter-spacing:.02em;display:inline-flex;align-items:center;gap:7px;font-size:14px;color:var(--ink);transition:background .15s,border-color .15s}
.chip .n{font-size:11.5px;color:var(--muted)}
.chip:hover{border-color:var(--accent)}
.chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent);font-weight:600;box-shadow:0 0 0 2px var(--surface),0 0 0 3px var(--accent)}
.chip[aria-pressed="true"] .n{color:inherit;opacity:.85}
.chip.mini{height:28px;padding:0 12px;font-size:12.5px}
.wrapchips{display:flex;flex-wrap:wrap;gap:7px}
.field{display:grid;gap:5px;font-size:12.5px;color:var(--muted);font-weight:600}
.field input,.field select,.field textarea{height:42px;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);padding:0 13px;color:var(--ink);font-size:14.5px;font-weight:500;width:100%}
.field input:focus,.field select:focus,.field textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.field textarea{height:auto;padding:11px 13px;min-height:90px;resize:vertical;line-height:1.5}
.field.bad select{border-color:var(--accent)}
.seg{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--pill);overflow:hidden;background:var(--surface)}
.seg button{border:0;background:none;min-width:34px;height:32px;padding:0 10px;font-size:13.5px;font-weight:600}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);font-weight:700}
.toggle{display:flex;align-items:flex-start;gap:10px;font-size:14px;color:var(--muted);cursor:pointer}
.toggle input{margin-top:5px;accent-color:var(--accent)}
.toggle b{color:var(--ink);font-weight:700}
input[type=range]{width:100%;accent-color:var(--accent)}

/* ---------- page header ---------- */
.head{display:flex;align-items:flex-end;justify-content:space-between;gap:18px;flex-wrap:wrap;margin-bottom:24px}
.title{font-family:var(--serif);font-style:italic;font-weight:500;font-size:64px;line-height:.9;color:var(--accent-deep)}
.title small{font-family:var(--sans);font-style:normal;font-size:13px;font-weight:500;letter-spacing:.06em;color:var(--gold);margin-left:16px;vertical-align:middle}
.lede{margin:12px 0 0;color:var(--muted);max-width:60ch}
.head-actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.search{position:relative}
.search input{height:42px;width:220px;border-radius:var(--pill);border:1px solid var(--line);background:var(--glass);padding:0 16px 0 40px;font-weight:500}
.search input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.search svg{position:absolute;left:15px;top:12px;width:17px;height:17px;color:var(--accent)}
select.pill{height:42px;border-radius:var(--pill);border:1px solid var(--line);background:var(--glass);padding:0 14px;font-weight:600}
.swatches{display:flex;gap:9px;align-items:center;flex-wrap:wrap;margin-bottom:22px}
.swatches .lbl{font-size:13px;color:var(--muted);margin-right:4px;font-weight:600}
.sw{width:26px;height:26px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);padding:0;transition:transform .12s}
.sw:hover{transform:scale(1.12)}
.sw[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent);transform:scale(1.15)}
.hint{font-size:13px;color:var(--muted);margin:-12px 0 20px}
.nudge{display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap;padding:18px 22px;margin-bottom:26px;border:1px solid var(--line);border-radius:var(--r-lg);
  background:linear-gradient(100deg,var(--accent-soft),var(--glass) 55%);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.nudge p{margin:0;max-width:62ch}
.nudge b{font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;color:var(--accent-deep)}

/* ---------- closet grid: arch frames ---------- */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:28px 20px;align-items:start}
.card{display:block;width:100%;border:0;background:none;padding:0;text-align:left;-webkit-tap-highlight-color:transparent}
.card .tile{transition:transform .2s,box-shadow .2s}
.card:hover .tile{transform:translateY(-3px);box-shadow:0 18px 26px -18px rgba(120,60,35,.55)}
.card.armed .tile{box-shadow:0 0 0 2px var(--accent)}
.card .name{font-weight:500;letter-spacing:.02em;margin-top:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-size:14.5px;text-align:center}
.card .meta{display:flex;align-items:center;justify-content:center;gap:6px;font-size:12.5px;color:var(--muted)}
.dots{display:inline-flex}
.cdot{width:10px;height:10px;border-radius:50%;border:1.5px solid var(--surface);box-shadow:0 0 0 .5px var(--line-strong);flex:none}
.dots .cdot+.cdot{margin-left:-3px}
.tile{aspect-ratio:3/4;border-radius:var(--arch);background:radial-gradient(110% 80% at 50% 30%,var(--tile-hi) 0%,var(--tile) 75%);display:grid;place-items:end center;padding-bottom:10%;overflow:hidden;position:relative;border:1px solid rgba(255,255,255,.6);box-shadow:inset 0 0 0 5px rgba(255,255,255,.45)}
.tile img{width:76%;height:70%;object-fit:contain;filter:var(--drop);pointer-events:none}
.tile img.raw{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:none}
.empty{border:1px solid var(--line);border-radius:var(--r-lg);padding:60px 24px;text-align:center;display:grid;gap:14px;justify-items:center;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.empty::before{content:"";width:46px;height:58px;border-radius:999px 999px 6px 6px;background:var(--accent);box-shadow:inset 0 0 0 5px var(--surface),0 0 0 1px var(--accent)}
.empty h2{font-style:italic;font-weight:500;font-size:34px}
.empty p{margin:0;max-width:46ch;color:var(--muted)}

/* ---------- modal ---------- */
.back{position:fixed;inset:0;background:rgba(60,32,22,.38);-webkit-backdrop-filter:blur(4px);backdrop-filter:blur(4px);display:grid;place-items:center;padding:24px;z-index:40;animation:fade .15s ease}
.modal{background:var(--surface);border-radius:var(--r-lg);width:min(980px,100%);max-height:min(90dvh,800px);overflow:auto;box-shadow:0 40px 90px -40px rgba(60,25,10,.7);position:relative;animation:rise .2s ease;border:1px solid var(--line)}
.modal.narrow{width:min(560px,100%)}
.modal-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:26px 28px 0}
.modal-head h2{font-size:34px;font-style:italic;font-weight:500;padding-right:40px}
.modal-body{padding:16px 28px 28px}
.close{position:absolute;top:16px;right:16px;z-index:2}
@keyframes fade{from{opacity:0}}
@keyframes rise{from{transform:translateY(14px);opacity:0}}

/* ---------- upload / scan ---------- */
.drop{border:1px dashed var(--gold);border-radius:var(--r-lg);padding:30px;text-align:center;display:grid;gap:8px;justify-items:center;background:linear-gradient(180deg,var(--accent-soft),transparent);cursor:pointer;transition:background .15s}
.drop.over{background:var(--accent-soft)}
.drop svg{width:28px;height:28px;stroke-width:1.5;color:var(--accent)}
.drop strong{font-family:var(--serif);font-style:italic;font-weight:600;font-size:26px;color:var(--accent-deep)}
.prow{display:grid;grid-template-columns:96px 1fr auto;gap:16px;align-items:start;padding:18px 0;border-bottom:1px dashed var(--line-strong)}
.prow .tile{aspect-ratio:3/4}
.pfields{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pfields .wide{grid-column:1/-1}
.detected{display:inline-block;margin-left:6px;font-size:10.5px;color:var(--accent-ink);background:var(--accent);border-radius:var(--pill);padding:0 7px;line-height:17px}
.scanline{font-size:13px;color:var(--muted);grid-column:1/-1;line-height:1.45}
.scanline.busy::before{content:"";display:inline-block;width:10px;height:10px;border-radius:50%;border:2px solid var(--accent);border-right-color:transparent;margin-right:8px;vertical-align:-1px;animation:spin .8s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.colorpick{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.colorpick button{width:28px;height:28px;border-radius:50%;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line-strong);padding:0}
.colorpick button[aria-pressed="true"]{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--accent)}
.foot{display:flex;justify-content:space-between;align-items:center;gap:12px;padding-top:18px;flex-wrap:wrap}
.more{border:0;background:none;padding:0;color:var(--accent);font-size:13px;font-weight:600}

/* ---------- detail ---------- */
.detail{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:34px;padding:28px}
.photo{border-radius:999px 999px var(--r) var(--r);aspect-ratio:4/5;overflow:hidden;background:radial-gradient(110% 80% at 50% 30%,var(--tile-hi) 0%,var(--tile) 75%);display:grid;place-items:end center;padding-bottom:8%;position:relative;box-shadow:inset 0 0 0 8px rgba(255,255,255,.45)}
.photo img{width:78%;height:74%;object-fit:contain;filter:var(--drop)}
.photo img.raw{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;filter:none}
.photo-tabs{display:flex;gap:6px;margin-top:12px;justify-content:center}
.photo-tabs button{border:1px solid var(--line);background:var(--surface);padding:4px 14px;border-radius:var(--pill);color:var(--muted);font-size:13px;font-weight:600}
.photo-tabs button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.dinfo h2{font-size:42px;font-style:italic;font-weight:500;padding-right:40px}
.dinfo .cat{color:var(--accent-deep);margin:8px 0 18px;font-weight:600}
.palette{display:flex;gap:3px;margin:0 0 18px;height:30px;border-radius:var(--pill);overflow:hidden;border:2px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.palette span{display:block;height:100%}
.facts{display:grid;grid-template-columns:auto 1fr;gap:9px 22px;margin:0 0 18px}
.facts dt{color:var(--muted);font-size:14px}
.facts dd{margin:0;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.scale{display:inline-flex;gap:5px}
.scale i{width:10px;height:10px;border-radius:50%;background:var(--line-strong)}
.scale i.on{background:var(--accent)}
.vchips{display:flex;flex-wrap:wrap;gap:6px}
.vchip{font-size:12.5px;padding:2px 11px;background:var(--accent-soft);color:var(--accent-deep);border-radius:var(--pill);font-weight:600}
.dactions{display:grid;gap:10px}
.dactions .row{display:flex;gap:10px;align-items:center}
.dactions .row .btn{flex:1}
.section{grid-column:1/-1;border-top:1px dashed var(--line-strong);padding-top:24px}
.section h3{font-size:30px;font-style:italic;font-weight:500;margin-bottom:16px;text-align:center}
.strip{display:grid;grid-template-columns:repeat(auto-fill,minmax(110px,1fr));gap:16px}
.strip .card .name{font-size:13px;margin-top:8px}
.mini-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.mini{border:1px solid var(--line);border-radius:var(--r-lg);padding:10px;background:var(--bg)}
.mini .t{font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;margin:12px 4px 2px}
.mini .s{font-size:13px;color:var(--muted);margin:0 4px 10px;line-height:1.4}
.mini .row{display:flex;gap:6px;padding:0 2px 2px}

/* ---------- collage ---------- */
.collage{display:grid;gap:8px;aspect-ratio:4/5;width:100%}
.col{display:flex;flex-direction:column;gap:8px;min-height:0;min-width:0}
.piece{flex:1 1 0;min-height:0;border-radius:18px;background:radial-gradient(110% 80% at 50% 35%,var(--tile-hi) 0%,var(--tile) 78%);display:grid;place-items:center;overflow:hidden;border:0;padding:0;position:relative}
.piece img{width:84%;height:84%;object-fit:contain;filter:var(--drop);pointer-events:none}
.piece img.raw{width:100%;height:100%;object-fit:cover;filter:none}
.piece.anchor::after{content:"";position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 0 2px var(--accent)}
button.piece:hover::after{content:"";position:absolute;inset:0;border-radius:18px;box-shadow:inset 0 0 0 1.5px var(--accent-2)}
.collage.small{gap:5px}
.collage.small .col{gap:5px}
.collage.small .piece{border-radius:12px}

/* ---------- outfits ---------- */
.gen{display:grid;grid-template-columns:300px minmax(0,1fr);gap:36px;align-items:start}
.panel{display:grid;gap:20px;position:sticky;top:0;padding:24px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px);box-shadow:var(--shadow)}
.panel .title{font-size:52px}
.panel h3{font-family:var(--sans);font-size:13.5px;font-weight:700;margin-bottom:10px;color:var(--ink)}
.panel .chip{height:32px;padding:0 13px;font-size:13.5px;background:var(--surface)}
.panel .chip[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.forecast{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-bottom:12px;font-size:13px;color:var(--muted)}
.temprow{display:flex;align-items:baseline;justify-content:space-between;margin-top:14px}
.temp{font-family:var(--serif);font-size:40px;font-weight:600;color:var(--accent-deep)}
.unit{display:inline-flex;border:1px solid var(--line-strong);border-radius:var(--pill);overflow:hidden;background:var(--surface)}
.unit button{border:0;background:none;padding:3px 11px;font-size:13px;font-weight:700}
.unit button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.unit button{color:var(--muted)}
.custom{height:40px;border:1px solid var(--line-strong);border-radius:14px;background:var(--surface);padding:0 12px;width:100%;margin-top:9px}
.stage{display:grid;justify-items:center;align-content:start;gap:16px;min-width:0;padding-top:4px}
.ocard{width:min(100%,calc((100dvh - 260px) * .74),480px);background:var(--surface);border-radius:var(--r-lg);padding:12px;box-shadow:0 30px 60px -36px rgba(120,60,35,.65);border:1px solid var(--line);touch-action:pan-y;user-select:none;-webkit-user-select:none;position:relative;will-change:transform}
.ocard.fly{transition:transform .3s ease,opacity .3s ease}
.ocard .info{padding:14px 8px 6px;text-align:center}
.ocard .info h2{font-size:31px;font-style:italic;font-weight:600}
.why{margin:6px 0 0;padding:0;list-style:none;color:var(--muted);font-size:13.5px;line-height:1.45;display:grid;gap:3px}
.why li::before{content:"✦";color:var(--gold);margin-right:7px;font-size:11px}
.stamp{position:absolute;top:26px;padding:4px 16px;border-radius:var(--pill);font-family:var(--serif);font-style:italic;font-weight:600;font-size:28px;opacity:0;pointer-events:none;color:#fff;z-index:2}
.stamp.yes{left:24px;background:var(--ok);transform:rotate(-8deg)}
.stamp.no{right:24px;background:var(--accent);transform:rotate(8deg)}
.swipe-actions{display:flex;gap:26px;align-items:center}
.round{width:64px;height:64px;border-radius:50%;border:1px solid var(--line-strong);background:var(--surface);display:grid;place-items:center;box-shadow:0 14px 24px -16px rgba(90,40,20,.6);transition:transform .15s}
.round svg{width:26px;height:26px;stroke-width:2}
.round.no{color:var(--accent)}
.round.yes{background:var(--accent);border-color:var(--accent);color:#fff}
.round:hover{transform:scale(1.05)}
.swipe-hint{font-size:13px;color:var(--muted);text-align:center;max-width:46ch;margin:0}
.anchor-chip{display:inline-flex;align-items:center;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:var(--pill);padding:4px 6px 4px 5px;font-size:13.5px;font-weight:600;box-shadow:var(--shadow)}
.anchor-chip img{width:26px;height:26px;object-fit:cover;border-radius:50%}
.anchor-chip button{border:0;background:var(--accent-soft);width:24px;height:24px;border-radius:50%;display:grid;place-items:center;color:var(--accent-deep)}
.anchor-chip svg{width:12px;height:12px}
.ready{width:min(100%,calc((100dvh - 260px) * .72),460px);aspect-ratio:4/5.4;border-radius:999px 999px var(--r-lg) var(--r-lg);border:1px solid var(--gold);outline:1px solid var(--line);outline-offset:-10px;display:grid;place-items:center;text-align:center;padding:40px 30px 30px;background:var(--glass);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.ready h2{font-style:italic;font-weight:500;font-size:36px;color:var(--accent-deep)}
.summary-bar{display:none}
.selected{width:100%;max-width:900px;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.15fr);gap:24px;align-items:start}
.sel-col{display:grid;gap:12px}
.sel-col.info-col{padding:24px;border-radius:var(--r-lg);border:1px solid var(--line);background:var(--glass);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.tabs{display:inline-flex;gap:4px;padding:4px;background:var(--surface);border:1px solid var(--line-strong);border-radius:var(--pill);margin:10px 0 14px;justify-self:start}
.tabs button{border:0;background:none;padding:6px 16px;font-weight:500;color:var(--muted);border-radius:var(--pill);font-size:14px;white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.plist{display:grid;gap:8px}
.prow2{display:grid;grid-template-columns:56px 1fr auto;gap:14px;align-items:center;padding:6px;border-radius:18px;background:var(--surface);border:1px solid var(--line);text-align:left;width:100%;transition:border-color .15s}
.prow2:hover{border-color:var(--accent-2)}
.prow2 .tile{aspect-ratio:1;border-radius:14px;padding:0;place-items:center;box-shadow:none}
.prow2 .tile img{width:82%;height:82%}
.prow2 .nm{font-weight:500;line-height:1.25}
.prow2 .sub{font-size:13px;color:var(--muted)}
.prow2.on{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.check{width:26px;height:26px;border-radius:50%;border:1.5px solid var(--line-strong);display:grid;place-items:center;margin-right:8px}
.prow2.on .check{background:var(--accent);border-color:var(--accent);color:#fff}
.check svg{width:13px;height:13px;stroke-width:2.4}
.like-btn[aria-pressed="true"]{color:var(--accent-ink);background:var(--accent);border-color:var(--accent)}
.like-btn[aria-pressed="true"] svg path{fill:currentColor}
.tips{margin:12px 0 0;padding:12px 16px;background:var(--accent-soft);border-radius:18px;font-size:14px;color:var(--accent-deep);font-weight:500}
.fb-opts{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.fb-opts .btn{height:50px;justify-content:flex-start;border-radius:18px;font-weight:600}

/* ---------- inspiration ---------- */
.steps{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px;margin:6px 0 24px;padding:0;list-style:none;counter-reset:s}
.steps li{counter-increment:s;padding:16px 18px;border-radius:var(--r-lg);background:var(--glass);border:1px solid var(--line);font-size:14px;color:var(--muted);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
.steps li::before{content:counter(s);display:grid;place-items:center;width:34px;height:42px;border-radius:999px 999px 6px 6px;background:var(--accent);color:#fff;font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;margin-bottom:10px}
.insp-grid{display:grid;grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);gap:24px;align-items:start;margin:26px 0}
.box{background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);padding:26px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.box h2{font-size:32px;font-style:italic;font-weight:500;margin-bottom:6px}
.box > p{margin:0 0 16px;color:var(--muted);font-size:14.5px}
.dna-pal{display:flex;height:50px;border-radius:var(--pill);overflow:hidden;margin:4px 0 8px;border:3px solid var(--surface);box-shadow:0 0 0 1px var(--line)}
.dna-pal span{display:block;height:100%}
.dna-legend{display:flex;flex-wrap:wrap;gap:4px 12px;font-size:12.5px;color:var(--muted);margin-bottom:18px}
.bar{display:grid;grid-template-columns:96px 1fr 96px;align-items:center;gap:10px;font-size:12.5px;color:var(--muted);margin-bottom:10px;font-weight:600}
.bar .r{text-align:right}
.bar .track{height:6px;background:var(--accent-soft);position:relative;border-radius:3px}
.bar .track i{position:absolute;top:-4px;width:14px;height:14px;border-radius:50%;background:var(--accent);border:2px solid var(--surface);transform:translateX(-50%);box-shadow:0 2px 6px rgba(120,60,35,.4)}
.summary{font-family:var(--serif);font-style:italic;font-weight:500;font-size:22px;line-height:1.35;margin:18px 0;color:var(--accent-deep)}
.pins{columns:4 220px;column-gap:16px}
.pin{break-inside:avoid;margin:0 0 16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);overflow:hidden;box-shadow:var(--shadow)}
.pin img{width:100%;display:block}
.pin .pal{display:flex;height:8px}
.pin .pal span{flex:1}
.pin .pbody{padding:10px 12px 12px;display:grid;gap:9px}
.pin .pact{display:flex;gap:6px}
.matchrow{display:grid;grid-template-columns:repeat(auto-fill,minmax(92px,1fr));gap:14px}
.matchrow .card .name{font-size:12.5px}

/* ---------- liked ---------- */
.liked-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:22px}
.lcard{border:1px solid var(--line);padding:12px;background:var(--surface);border-radius:var(--r-lg);text-align:left;box-shadow:var(--shadow);transition:transform .2s}
.lcard:hover{transform:translateY(-3px)}
.lcard .t{font-family:var(--serif);font-style:italic;font-weight:600;font-size:24px;margin:12px 4px 2px}
.lcard .s{font-size:13px;color:var(--muted);margin:0 4px 2px}

/* ---------- sign-in: terracotta wall with a marble arch window ---------- */
.auth{height:100%;display:grid;grid-template-columns:1.1fr 1fr;overflow:auto}
.auth-art{background:linear-gradient(160deg,var(--accent),var(--accent-deep));color:#fff;padding:48px;display:grid;grid-template-rows:1fr auto;justify-items:center;align-items:center;gap:24px;position:relative;overflow:hidden}
.auth-art::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,rgba(255,255,255,.05) 0 1px,transparent 1px 72px);pointer-events:none}
.arch-window{width:min(360px,78%);aspect-ratio:3/4.2;border-radius:999px 999px 18px 18px;background:var(--glow),var(--stone) center/1600px,var(--base),var(--bg);box-shadow:inset 0 0 0 10px rgba(255,255,255,.6),0 40px 70px -30px rgba(70,25,10,.8);display:grid;place-items:center;text-align:center;padding:30px;position:relative}
.arch-window .big{font-family:var(--serif);font-style:italic;font-weight:600;font-size:clamp(56px,7vw,92px);line-height:.9;color:var(--accent-deep)}
.arch-window p{color:var(--ink);max-width:24ch;margin:14px auto 0;font-size:14.5px;opacity:.85}
.auth-art .foot-note{font-size:13px;opacity:.85;margin:0;position:relative}
.auth-form{display:grid;place-items:center;padding:40px 28px}
.auth-card{width:100%;max-width:390px;display:grid;gap:14px;background:var(--glass);border:1px solid var(--line);border-radius:var(--r-lg);padding:32px;box-shadow:var(--shadow);-webkit-backdrop-filter:blur(14px);backdrop-filter:blur(14px)}
.auth-card h1{font-size:44px;font-style:italic;font-weight:500}
.auth-card .err{color:var(--accent-deep);font-size:13.5px;min-height:20px}
.acct{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-strong);border-radius:var(--pill);padding:4px 12px 4px 4px;background:var(--surface);font-size:13.5px;font-weight:600;margin:0 6px 6px 0}
.acct span{width:26px;height:26px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:12px}

.toast{position:fixed;left:50%;bottom:calc(26px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 20px;border-radius:var(--pill);font-size:14px;font-weight:600;z-index:60;max-width:min(92vw,540px);text-align:center;box-shadow:0 14px 30px -12px rgba(60,25,10,.5);animation:rise .2s ease}
.boot{height:100%;display:grid;place-items:center}
.boot span{font-family:var(--serif);font-style:italic;font-size:52px;color:var(--accent-deep)}


/* white boxes lift off the marble */
.rail,.panel,.box,.nudge,.steps li,.auth-card,.sel-col.info-col,.lcard,.pin,.mini,.ocard,.empty,.ready{box-shadow:var(--shadow)}
.rail,.panel,.box,.steps li,.auth-card,.sel-col.info-col,.lcard,.pin,.ocard{border-color:rgba(255,255,255,.9);outline:1px solid var(--line);outline-offset:-1px}
.card .tile{box-shadow:0 1px 2px rgba(45,35,30,.05),0 14px 26px -18px rgba(45,35,30,.4),inset 0 0 0 5px rgba(255,255,255,.55)}
.search input,select.pill{background:var(--surface)}
.nudge{background:linear-gradient(100deg,var(--accent-soft),var(--surface) 55%)}
/* ---------- finish the look ---------- */
.finish{display:grid;gap:22px}
.finish-sec h3{font-family:var(--serif);font-style:italic;font-weight:600;font-size:22px;margin:0 0 2px}
.fs-hint{margin:0 0 10px;color:var(--muted);font-size:13.5px}
.none-tile{display:grid;place-items:center;color:var(--muted);background:var(--bg)!important;box-shadow:none!important}
.none-tile svg{width:16px;height:16px}
/* ---------- laundry ---------- */
.card.laundry .tile img{opacity:.4;filter:grayscale(.5)}
.lbadge{position:absolute;top:16%;left:50%;transform:translateX(-50%);background:var(--surface);color:var(--accent-deep);font-size:11.5px;font-weight:600;border-radius:999px;padding:3px 11px;border:1px solid var(--line-strong);white-space:nowrap;z-index:1}
.laundry-note{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin:-8px 0 18px;padding:10px 12px 10px 18px;background:var(--surface);border-radius:var(--pill);box-shadow:var(--shadow);font-size:14px}
/* ---------- planner ---------- */
.modebar{margin:0;justify-self:stretch;display:flex}
.modebar button{flex:1;white-space:nowrap;padding:6px 10px}
.stage.plan{justify-items:stretch}
.plan-top{display:flex;justify-content:center}
.plan-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(196px,1fr));gap:16px;width:100%}
.day{background:var(--surface);border-radius:var(--r-lg);padding:12px;display:grid;gap:10px;box-shadow:var(--shadow);outline:1px solid var(--line);outline-offset:-1px;align-content:start}
.day.off{opacity:.7}
.day-head{display:flex;justify-content:space-between;align-items:center;gap:8px}
.day-head b{font-family:var(--serif);font-style:italic;font-size:22px;font-weight:600;color:var(--accent-deep)}
.skip{display:flex;gap:6px;align-items:center;font-size:12.5px;color:var(--muted)}
.skip input{accent-color:var(--accent)}
.day-fields{display:grid;gap:6px}
.day-fields select,.day-fields input{height:34px;border:1px solid var(--line-strong);border-radius:10px;background:var(--surface);padding:0 8px;font-size:13.5px;width:100%;min-width:0}
.day-wx{display:grid;grid-template-columns:1fr 62px auto;gap:6px;align-items:center;font-size:13px;color:var(--muted)}
.day-look{border:0;padding:0;background:none;display:block;width:100%}
.day-title{font-family:var(--serif);font-style:italic;font-size:19px;font-weight:600;line-height:1.1}
.day-act{display:flex;gap:6px}
.day-act .btn{flex:1;padding:0 8px}
.day-empty{border:1px dashed var(--line-strong);border-radius:16px;aspect-ratio:4/5;display:grid;place-items:center;color:var(--muted);font-size:13px;text-align:center;padding:10px}
.pack{margin-top:22px}
.pack h3{font-family:var(--sans);font-size:13.5px;font-weight:600;margin:14px 0 6px;color:var(--accent-deep)}
.pack-row{display:grid;grid-template-columns:auto 44px 1fr auto;align-items:center;gap:10px;padding:5px 8px;border-radius:14px;cursor:pointer}
.pack-row:hover{background:var(--accent-soft)}
.pack-row input{accent-color:var(--accent);width:18px;height:18px}
.pack-row img{width:44px;height:44px;object-fit:contain;filter:var(--drop)}
.pack-row small{color:var(--muted)}
.pack-row.done span{text-decoration:line-through;color:var(--muted)}
/* ---------- journal ---------- */
.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:30px}
.stat{background:var(--surface);border-radius:var(--r-lg);padding:18px 22px;box-shadow:var(--shadow);outline:1px solid var(--line);outline-offset:-1px}
.stat b{display:block;font-family:var(--serif);font-size:44px;font-weight:600;color:var(--accent-deep);line-height:1}
.stat span{color:var(--muted);font-size:13.5px}
.jsec{margin:0 0 34px}
.jsec h2{font-size:34px;font-style:italic;font-weight:500;margin-bottom:6px}
.jsec > p{margin:0 0 16px;color:var(--muted)}
.diary{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:16px}
.entry{background:var(--surface);border-radius:var(--r-lg);padding:10px;box-shadow:var(--shadow);outline:1px solid var(--line);outline-offset:-1px;position:relative}
.entry .d{font-size:12.5px;color:var(--gold);font-weight:600;letter-spacing:.04em;margin:9px 4px 0}
.entry .t{font-family:var(--serif);font-style:italic;font-size:19px;font-weight:600;margin:0 4px 2px}
.entry .rm{position:absolute;top:16px;right:16px;width:28px;height:28px;border-radius:50%;border:0;background:var(--surface);display:grid;place-items:center;box-shadow:0 2px 8px rgba(0,0,0,.15);z-index:25}
.entry .rm svg{width:12px;height:12px}
.forgot-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(128px,1fr));gap:18px}
.forgot{display:grid;gap:6px;align-content:start;min-width:0}
.card,.entry,.day,.forgot>*{min-width:0}
.gaps{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:14px}
.gap{background:var(--surface);border-radius:var(--r-lg);padding:18px 22px;box-shadow:var(--shadow);outline:1px solid var(--line);outline-offset:-1px;border-top:3px solid var(--accent)}
.gap small{color:var(--gold);font-weight:600;letter-spacing:.05em;font-size:12px}
.gap h3{font-size:26px;font-style:italic;font-weight:600;margin:4px 0 6px}
.gap p{margin:0 0 10px;color:var(--muted);font-size:14px}
.gap .un{font-size:13px;font-weight:600;color:var(--accent-deep)}
/* ---------- outfit photos ---------- */
.modal.mid{width:min(820px,100%)}
.op-grid{display:grid;grid-template-columns:minmax(0,230px) minmax(0,1fr);gap:24px;align-items:start}
.op-photo{border-radius:999px 999px 16px 16px;overflow:hidden;background:var(--tile)}
.op-photo img{width:100%;display:block}
.op-slot{margin-bottom:12px}
.op-slot h4{margin:0 0 6px;font-size:13.5px;font-weight:600}
.op-cands{display:flex;gap:8px;overflow-x:auto;padding:4px 3px 6px}
.op-cand{flex:none;width:76px;border:1px solid var(--line-strong);border-radius:14px;padding:4px;background:var(--surface);display:grid;gap:3px;font-size:11px;line-height:1.2;text-align:center}
.op-cand span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.op-cand .tile{aspect-ratio:1;border-radius:10px;padding:0;place-items:center;box-shadow:none}
.op-cand .tile img{width:84%;height:84%}
.op-cand[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent)}
.op-none{flex:none;width:76px;border:1px dashed var(--line-strong);border-radius:14px;background:none;font-size:12px;color:var(--muted)}
.op-none[aria-pressed="true"]{border:1px solid var(--ink);color:var(--ink);font-weight:600}
.lcard{position:relative}
.photo-badge{position:absolute;top:20px;right:20px;width:46px;height:46px;border-radius:50%;object-fit:cover;border:2px solid var(--surface);box-shadow:0 4px 12px rgba(0,0,0,.2);z-index:25}
.liked-pair{display:grid;grid-template-columns:1fr 1fr;gap:14px;align-items:start}
.mobile-settings{display:none}
/* ---------- "something else" inputs ---------- */
.anycolor{display:inline-flex;align-items:center;gap:6px;font-size:12.5px;color:var(--muted);font-weight:600;cursor:pointer}
.anycolor input{width:28px;height:28px;padding:0;border:2px solid var(--surface);border-radius:50%;box-shadow:0 0 0 1px var(--line-strong);background:conic-gradient(#d33,#e8c840,#3f8a4e,#3a6fd8,#7a4fb0,#d33);cursor:pointer;overflow:hidden}
.anycolor input::-webkit-color-swatch-wrapper{padding:0}
.anycolor input::-webkit-color-swatch{border:0;border-radius:50%}
.anycolor input::-moz-color-swatch{border:0;border-radius:50%}
/* ---------- cutout fixer ---------- */
.prev-col{display:grid;gap:6px;justify-items:center}
.fix-grid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:24px;align-items:start}
.fix-stage{border-radius:18px;overflow:hidden;background:var(--tile);line-height:0;justify-self:center}
.fix-canvas{display:block;cursor:crosshair;touch-action:manipulation}
.fix-range{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;font-size:12.5px;color:var(--muted)}
.fix-link{border:0!important;background:none!important;color:var(--accent)!important;font-weight:600;text-decoration:underline;text-underline-offset:3px}
/* ---------- phones ---------- */
@media (max-width: 899px){
  .app{grid-template-columns:minmax(0,1fr);padding:0;gap:0}
  .rail{display:none}
  .view{padding:20px 16px calc(110px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:flex;position:fixed;left:12px;right:12px;bottom:calc(10px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--glass);-webkit-backdrop-filter:blur(16px);backdrop-filter:blur(16px);border:1px solid var(--line);border-radius:var(--pill);padding:6px;box-shadow:0 18px 30px -18px rgba(90,40,20,.6)}
  .tabbar button{flex:1;border:0;background:none;display:grid;justify-items:center;gap:1px;padding:6px 0 7px;font-size:11px;font-weight:700;color:var(--muted);border-radius:var(--pill)}
  .tabbar button svg{width:21px;height:21px;stroke-width:1.7}
  .tabbar button[aria-current="page"]{color:var(--accent-ink);background:var(--accent)}
  .title{font-size:48px}
  .panel .title{font-size:46px}
  .head-actions{width:100%}
  .search{flex:1}
  .search input{width:100%}
  .grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 14px}
  .back{place-items:end stretch;padding:0}
  .modal{border-radius:var(--r-lg) var(--r-lg) 0 0;max-height:94dvh;width:100%;padding-bottom:env(safe-area-inset-bottom,0px)}
  .modal-head{padding:24px 18px 0}
  .modal-body{padding:14px 18px 22px}
  .detail{grid-template-columns:minmax(0,1fr);padding:22px 18px;gap:20px}
  .photo{aspect-ratio:4/4.6;max-width:360px;width:100%;justify-self:center}
  .pfields{grid-template-columns:1fr 1fr}
  .prow{grid-template-columns:72px 1fr auto;gap:12px}
  .gen{grid-template-columns:minmax(0,1fr);gap:18px}
  .panel{position:static;padding:20px}
  .gen.collapsed .panel{display:none}
  .gen.collapsed .summary-bar{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--glass);border:1px solid var(--line);border-radius:var(--pill);padding:8px 8px 8px 18px;font-size:14px;font-weight:600;-webkit-backdrop-filter:blur(12px);backdrop-filter:blur(12px)}
  .ocard,.ready{width:min(100%,calc((100dvh - 320px) * .74))}
  .selected{grid-template-columns:minmax(0,1fr)}
  .selected .sel-col:first-child{max-width:360px;justify-self:center;width:100%}
  .insp-grid{grid-template-columns:minmax(0,1fr)}
  .steps{grid-template-columns:minmax(0,1fr);gap:10px}
  .steps li{display:grid;grid-template-columns:auto 1fr;gap:12px;align-items:center}
  .steps li::before{margin:0}
  .pins{columns:2 150px;column-gap:12px}
  .fb-opts{grid-template-columns:1fr}
  .fix-grid{grid-template-columns:minmax(0,1fr)}
  .mobile-settings{display:grid;place-items:center;position:fixed;top:calc(14px + env(safe-area-inset-top,0px));right:14px;z-index:31;width:42px;height:42px;border-radius:50%;border:1px solid var(--line);background:var(--surface);color:var(--accent-deep);box-shadow:var(--shadow)}
  .mobile-settings svg{width:20px;height:20px;stroke-width:1.6}
  .view{padding-top:22px}
  .head{padding-right:48px}
  .stats{gap:8px}
  .stat{padding:14px}
  .stat b{font-size:30px}
  .plan-grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
  .day{padding:9px}
  .day-wx{grid-template-columns:1fr 52px}
  .day-wx span{display:none}
  .day-head b{font-size:17px}
  .op-grid{grid-template-columns:minmax(0,1fr)}

/* ---------- photo polish (no AI): true colors, smooth edges, straight, evenly framed ---------- */
/* White balance and exposure from the plain surface the piece was photographed on */
function wbGains(px,W,H){
  const idx=[]; for(let x=0;x<W;x++){ idx.push(x,(H-1)*W+x); } for(let y=1;y<H-1;y++){ idx.push(y*W,y*W+W-1); }
  const med=k=>{ const a=idx.map(i=>px[i*4+k]).sort((p,q)=>p-q); return a[a.length>>1]; };
  const r=Math.max(1,med(0)),g=Math.max(1,med(1)),b=Math.max(1,med(2)); const lab=rgbToLab(r,g,b); const C=Math.hypot(lab[1],lab[2]);
  let sp=0; for(const i of idx){ const L=rgbToLab(px[i*4],px[i*4+1],px[i*4+2]); sp+=(L[0]-lab[0])**2+(L[1]-lab[1])**2+(L[2]-lab[2])**2; } sp=Math.sqrt(sp/idx.length);
  if(sp>12||C>20||lab[0]<55) return null;              // only light, near-white surfaces (walls, sheets): wood, carpet or busy rooms are left alone
  const m=(r+g+b)/3; let gains=[m/r,m/g,m/b].map(x=>clamp(1+(x-1)*.7,.82,1.22));
  if(lab[0]>55&&lab[0]<88){ const e=clamp(86/lab[0],1,1.22); gains=gains.map(x=>x*e); }   // a dim white surface: brighten it back to white

/* Takes a canvas with a transparent background and returns a polished, straightened, evenly framed copy */

      for(let x=0;x<W;x++){ t[y*W+x]=s/c; const xo=x-r, xi=x+r+1; if(xo>=0){ s-=a[y*W+xo]; c--; } if(xi<W){ s+=a[y*W+xi]; c++; } } }
    for(let x=0;x<W;x++){ let s=0,c=0; for(let y=-r;y<=r;y++) if(y>=0&&y<H){ s+=t[y*W+x]; c++; }
      for(let y=0;y<H;y++){ a[y*W+x]=s/c; const yo=y-r, yi=y+r+1; if(yo>=0){ s-=t[yo*W+x]; c--; } if(yi<H){ s+=t[yi*W+x]; c++; } } }

async function canvasBlob(c){ let b=await toBlob(c,'image/webp',.9); if(!b||b.type!=='image/webp') b=await toBlob(c,'image/png'); return b; }
function colorsFromCanvas(c){
  const W=c.width,H=c.height, d=c.getContext('2d',{willReadFrequently:true}).getImageData(0,0,W,H).data; const st=Math.max(1,Math.floor(Math.sqrt(W*H/4000))); const pts=[];

/* Turns shape + color clues into a best guess at type and style */
function guessType(F,colors,pattern,edge){
  const p=colors[0]||{fam:'gray',L:50,C:0}; const blueish=['denim','blue','navy','lightblue'].includes(p.fam)||(p.fam==='black'&&edge>5);
  const S={};const add=(k,v)=>S[k]=(S[k]||0)+v;
  if(F.pair){ add('shoes',3.6); }
  else if(F.legs>.45&&F.aspect>.6){ if(F.aspect<1.2) add('shorts',3.2); else add(blueish?'jeans':'bottoms',3.2); if(blueish&&edge>4) add('jeans',1); }
  if(F.aspect<.75&&F.fill>.35&&F.legs<.3) add('shoes',1.8);
  if(F.three>.3&&F.aspect>1.25&&F.legs<.3) add('outerwear',2.6);
  if((F.wSh>F.wMid*1.22||F.three>.3)&&F.aspect>.6&&F.aspect<1.45&&F.legs<.3) add('tops',2.2);
  if(F.aspect>1.35&&F.legs<.2&&F.wLow>=F.wMid*1.02&&F.three<.25&&F.wSh<=F.wMid*1.25) add('dresses',2.3);
  if(F.fill>.82&&F.aspect>.6&&F.aspect<1.4&&F.legs<.2&&F.three<.2) add('accessories',1.5);
  if(F.aspect>1.5&&F.legs<.2&&F.wLow<=F.wMid*1.02&&F.wTop>=.55&&F.three<.25) add('outerwear',1.7);
  if(F.aspect>.7&&F.aspect<1.7&&F.wTop<F.wLow*.8&&F.legs<.2&&F.three<.2&&F.wSh<F.wMid*1.1) add('bottoms',1.5);
  if(F.handle>.4&&F.fill>.45&&F.aspect>.6&&F.aspect<1.4) add('accessories',1.6);
  if(F.aspect<1&&F.wTop<F.wLow*.75&&F.legs<.2&&F.fill>.4) add('head',1);
  if(pattern==='graphic') add('tops',.8);
  const ranked=Object.entries(S).sort((a,b)=>b[1]-a[1]); if(!ranked.length||ranked[0][1]<1.5) return {cat:'',sub:'',conf:0};
  const cat=ranked[0][0], second=ranked[1]?.[1]||0, conf=clamp((ranked[0][1]-second)/ranked[0][1],.3,.95);
  let sub='';
  if(cat==='jeans') sub=F.wLow>F.wMid*1.15?'flare':F.wLow>F.wMid*.95?'wide-jeans':'straight';
  if(cat==='bottoms') sub=F.legs>.45?(F.wLow>F.wMid*.95?'wide-leg':'trousers'):(F.aspect>1.35?'midi-skirt':'mini-skirt');
  if(cat==='tops') sub=pattern==='graphic'?'graphic-tee':(F.three>.3||F.aspect>1.15?'long-sleeve':'tee');
  if(cat==='dresses') sub=F.aspect>2.3?'maxi':F.aspect>1.7?'midi':'mini';
  if(cat==='outerwear') sub=F.aspect>1.6?'wool-coat':'blazer';
  if(cat==='shorts') sub=blueish?'denim-shorts':'tailored-shorts';
  if(cat==='shoes') sub=F.aspect>1?'tall-boots':F.aspect>.7?'ankle-boots':'sneakers';
  if(cat==='accessories') sub='handbag';
  return {cat,sub,conf};
}
/* Analyzes a Pinterest / inspiration image: palette, contrast, busyness */
async function analyzePin(file){
  const bmp=await loadBitmap(file); const photo=await jpegOf(bmp,1100);
  const A=150, s=A/Math.max(bmp.width,bmp.height), W=Math.max(8,Math.round(bmp.width*s)), H=Math.max(8,Math.round(bmp.height*s));
  const c=canvasOf(W,H), x=c.getContext('2d',{willReadFrequently:true}); x.drawImage(bmp,0,0,W,H); const px=x.getImageData(0,0,W,H).data;
  const pts=[], Ls=[]; let g=0,gn=0; const Lc=new Float32Array(W*H);
  for(let y=0;y<H;y++) for(let xx=0;xx<W;xx++){ const i=y*W+xx; const [L,a,b]=rgbToLab(px[i*4],px[i*4+1],px[i*4+2]); Lc[i]=L; const C=Math.hypot(a,b); let hh=Math.atan2(b,a)*180/Math.PI; if(hh<0) hh+=360;
    let w=(Math.abs(xx/W-.5)<.32&&Math.abs(y/H-.5)<.36)?1.6:1;
    if(L>92&&C<6) w*=.2;                                  // white space and backgrounds
    if(hh>20&&hh<70&&C>10&&C<38&&L>38&&L<85) w*=.35;      // skin tones
    pts.push([L,a,b,w]); Ls.push([L,w]); }
  for(let y=1;y<H-1;y++) for(let xx=1;xx<W-1;xx++){ const i=y*W+xx; g+=Math.hypot(Lc[i+1]-Lc[i-1],Lc[i+W]-Lc[i-W]); gn++; }
  const sub=pts.filter((_,i)=>i%2===0);
  const palette=mergeClusters(kmeans(sub,7),11,.04).slice(0,6);
  const tw=Ls.reduce((s,p)=>s+p[1],0)||1, mL=Ls.reduce((s,p)=>s+p[0]*p[1],0)/tw, sd=Math.sqrt(Ls.reduce((s,p)=>s+p[1]*(p[0]-mL)**2,0)/tw);
  const chrom=palette.filter(c=>!isNeutral(c)); const cw=chrom.reduce((s,c)=>s+c.w,0);
  return {photo,palette,colorful:+cw.toFixed(3),light:+mL.toFixed(1),contrast:+sd.toFixed(1),busy:+clamp((g/gn-4)/14,0,1).toFixed(3),warm:cw?+(chrom.filter(warmHue).reduce((s,c)=>s+c.w,0)/cw).toFixed(3):.5};
}

  save(a){ try{ localStorage.setItem('closet_accounts',JSON.stringify(a)); }catch(e){} },

const DB={
  db:null,
  open(user){ return new Promise((res,rej)=>{ const r=indexedDB.open('closet_'+user,2);
    r.onupgradeneeded=()=>{ const d=r.result; for(const s of ['items','liked','pins','meta','images','wear']) if(!d.objectStoreNames.contains(s)) d.createObjectStore(s); };
    r.onsuccess=()=>{ this.db=r.result; res(); }; r.onerror=()=>rej(r.error); }); },
  run(store,mode,fn){ return new Promise((res,rej)=>{ const t=this.db.transaction(store,mode); const req=fn(t.objectStore(store)); t.oncomplete=()=>res(req?req.result:undefined); t.onerror=()=>rej(t.error); t.onabort=()=>rej(t.error); }); },
  get(s,k){ return this.run(s,'readonly',st=>st.get(k)); },
  put(s,k,v){ return this.run(s,'readwrite',st=>st.put(v,k)); },
  del(s,k){ return this.run(s,'readwrite',st=>st.delete(k)); },
  all(s){ return this.run(s,'readonly',st=>st.getAll()); },
  keys(s){ return this.run(s,'readonly',st=>st.getAllKeys()); },
};
const IMG={ urls:new Map(),
  async put(blob){ const id=uid(); await DB.put('images',id,blob); this.urls.set(id,URL.createObjectURL(blob)); return id; },
  url(id){ return id?this.urls.get(id)||'':''; },
  async del(id){ if(!id) return; try{ await DB.del('images',id); }catch(e){} const u=this.urls.get(id); if(u) URL.revokeObjectURL(u); this.urls.delete(id); },
  async preload(){ const keys=await DB.keys('images'); await Promise.all(keys.map(async k=>{ const b=await DB.get('images',k); if(b) this.urls.set(k,URL.createObjectURL(b)); })); },
  clear(){ for(const u of this.urls.values()) URL.revokeObjectURL(u); this.urls.clear(); },
};

/* Accessories */
function accKind(it){ if(it.category==='head') return 'head'; const f=flagsOf(it); for(const k of ['bag','jewelry','belt','scarf','eyewear']) if(f.has(k)) return k; return 'other'; }

function accScore(it,o,ctx){
  if(!ctx.fit.has(it.id)) ctx.fit.set(it.id,itemFit(it,ctx)); let s=ctx.fit.get(it.id);
  const fl=flagsOf(it), P=piecesOf(o); if(!P.length) return s;
  if(fl.has('cold')) s+=ctx.t<48?1.8:ctx.t<58?.4:-3;
  if(fl.has('sun')) s+=(ctx.sunny&&!ctx.wet)?(ctx.t>=65?1.2:.5):-1.4;

function pickAccessories(o,ctx,max){

  const cands=S.items.filter(i=>slotOf(i)==='acc'&&!i.laundry&&!(o.accessories||[]).includes(i.id)).map(it=>({it,s:accScore(it,o,ctx)+Math.random()*.4})).sort((a,b)=>b.s-a.s);

}
/* Title and explanation */
function titleFor(o,r){
  const P=piecesOf(o); const cnt={}; P.forEach(p=>vibesOf(p.it).forEach(v=>cnt[v]=(cnt[v]||0)+1));
  const vib=Object.entries(cnt).sort((a,b)=>b[1]-a[1])[0]?.[0]; const adj=VIBE_ADJ[vib]||'Easy'; const g=r.groups;

  if(g.length===1) return (r.kinds.tonal||r.kinds.mono)?`Tonal ${colorWord(g[0].fam)}`:`${adj}, with ${colorWord(g[0].fam)}`;

function finalize(o,ctx,source){

/* Search: build candidates, score every combination, return the best distinct outfits */
function generate(n,opts={}){
  const ctx=makeCtx(opts); const g=S.gen; const anchor=opts.anchor?I(opts.anchor):null; const aslot=anchor?slotOf(anchor):null;
  for(const it of S.items) ctx.fit.set(it.id,itemFit(it,ctx));
  const pool=slot=>{ const all=S.items.filter(i=>slotOf(i)===slot&&!i.laundry).sort((a,b)=>ctx.fit.get(b.id)-ctx.fit.get(a.id)); const ok=all.filter(i=>ctx.fit.get(i.id)>-5); return ok.length||slot==='dress'||slot==='outer'?ok:all.slice(0,3); };
  const take=(arr,k)=>{ const top=arr.slice(0,k), rest=arr.slice(k); for(let i=0;i<3&&rest.length;i++) top.push(rest.splice(Math.floor(Math.random()*rest.length),1)[0]); return top; };
  let tops=take(pool('top'),9), bottoms=take(pool('bottom'),9), dresses=take(pool('dress'),7), outers=take(pool('outer'),6), shoes=take(pool('shoes'),6);
  if(aslot==='top'){ tops=[anchor]; dresses=[]; } if(aslot==='bottom'){ bottoms=[anchor]; dresses=[]; } if(aslot==='dress'){ dresses=[anchor]; tops=[]; bottoms=[]; }
  if(aslot==='outer') outers=[anchor]; if(aslot==='shoes') shoes=[anchor];
  const bases=[]; for(const t of tops) for(const b of bottoms) bases.push({top:t.id,bottom:b.id}); for(const d of dresses) bases.push({dress:d.id});
  if(!bases.length&&!aslot){ S.items.filter(i=>slotOf(i)==='dress').forEach(d=>bases.push({dress:d.id})); }
  if(!bases.length) return [];
  const noise=()=>Math.random()*WEIGHTS.randomness;
  const ranked=bases.map(b=>({b,s:scoreOutfit(b,ctx)+noise()})).sort((x,y)=>y.s-x.s).slice(0,40);
  const outerOpts=aslot==='outer'?outers:[null,...outers], shoeOpts=shoes.length?shoes:[null];
  const cands=[];
  for(const {b} of ranked){ let best=null;
    for(const sh of shoeOpts) for(const ou of outerOpts){ const o={...b,shoes:sh?sh.id:null,outer:ou?ou.id:null,accessories:[]}; const sc=scoreOutfit(o,ctx)+noise()-(S.wornKeys.has(comboKey(o))?2:0); if(!best||sc>best.sc) best={o,sc}; }

    for(const c of cands){ const key=comboKey(c.o); if((!opts.ignoreSeen&&g.seen.has(key))||chosen.some(x=>comboKey(x.o)===key)) continue;

}
/* Items that pair well with a given piece */
function pairsWellWith(it){

    const r=pairColor(ci,pc(x)); let b=0; for(const a of vibesOf(it)) for(const c of vibesOf(x)) b=Math.max(b,VA(a,c));

/* Learning from your choices */
function learnFrom(o,amount){

const pad2=n=>String(n).padStart(2,'0');

const parseISO=s=>{ const [y,m,d]=s.split('-').map(Number); return new Date(y,m-1,d); };
const isoAdd=(iso,n)=>{ const d=parseISO(iso); d.setDate(d.getDate()+n); return isoOf(d); };
const daysBetween=(a,b)=>Math.round((parseISO(b)-parseISO(a))/86400000);
const fmtDay=iso=>parseISO(iso).toLocaleDateString(undefined,{weekday:'short',month:'short',day:'numeric'});
const idsOf=o=>[o.top,o.bottom,o.dress,o.outer,o.sweater,o.shoes,...(o.accessories||[])].filter(Boolean);

  for(const w of S.wear) for(const id of idsOf(w)){ const e=m.get(id)||{count:0,last:null}; e.count++; if(!e.last||w.date>e.last) e.last=w.date; m.set(id,e); }
  for(const e of m.values()) e.days=e.last?daysBetween(e.last,t):null;
  S.wearIdx=m; S.wornKeys=new Set(S.wear.filter(w=>daysBetween(w.date,t)<=10).map(w=>comboKey(w)));
}
const wearInfo=id=>S.wearIdx.get(id)||{count:0,last:null,days:null};

/* ---------- style learning from your photos, closet and what you wear ---------- */
function buildProfile(){
  const pins=S.pins.filter(p=>p.palette&&p.palette.length);
  const main=S.items.filter(i=>slotOf(i)!=='acc');
  const sources=[];
  for(const p of pins) sources.push({pal:p.palette,w:p.source==='outfit'?1.5:1});
  let closetPal=null;
  if(main.length>=4){
    const likedCount=id=>S.liked.filter(l=>idsOf(l).includes(id)).length;
    const cl=[]; for(const it of main){ const w=.15+.5*wearInfo(it.id).count+.4*likedCount(it.id); (it.colors||[pc(it)]).slice(0,2).forEach(c=>cl.push({c,w:w*(c.w||1)})); }
    const tot=cl.reduce((s,x)=>s+x.w,0)||1; closetPal=cl.map(x=>({...x.c,w:x.w/tot}));
    sources.push({pal:closetPal,w:Math.min(2,.6+S.wear.length*.15+S.liked.length*.1)});
  }
  if(!sources.length) return null;
  const W=sources.reduce((s,x)=>s+x.w,0); const fam={}; const all=[];
  for(const src of sources) for(const c of src.pal){ const w=c.w*src.w/W; fam[c.fam]=(fam[c.fam]||0)+w; all.push({L:c.L,a:c.a,b:c.b,w}); }
  let stats;
  if(pins.length){ const n=pins.length, avg=k=>pins.reduce((s,p)=>s+(p[k]||0),0)/n; stats={colorful:avg('colorful'),light:avg('light'),contrast:avg('contrast'),busy:avg('busy'),warm:avg('warm')}; }
  else { const cs=closetPal; const tw=cs.reduce((s,c)=>s+c.w,0)||1; const chrom=cs.filter(c=>!isNeutral(c)); const cw=chrom.reduce((s,c)=>s+c.w,0);
    const mL=cs.reduce((s,c)=>s+c.L*c.w,0)/tw, sd=Math.sqrt(cs.reduce((s,c)=>s+c.w*(c.L-mL)**2,0)/tw);
    stats={colorful:cw/tw,light:mL,contrast:sd*.7,busy:main.filter(i=>BOLD_PATTERNS.has(i.pattern)).length/main.length,warm:cw?chrom.filter(warmHue).reduce((s,c)=>s+c.w,0)/cw:.5}; }
  const vib={}; for(const p of pins) for(const v of (p.vibes||[])) vib[v]=(vib[v]||0)+1; for(const v of S.myVibes) vib[v]=(vib[v]||0)+2;
  for(const w of [...S.wear,...S.liked]) for(const id of idsOf(w)){ const it=I(id); if(it) for(const v of vibesOf(it)) vib[v]=(vib[v]||0)+.25; }
  const vt=Object.values(vib).reduce((s,x)=>s+x,0); for(const k in vib) vib[k]/=vt||1;
  const maxFam=Math.max(...Object.values(fam),.0001);
  const photos=pins.filter(p=>p.source==='outfit').length;
  return {fam,maxFam,palette:mergeClusters(all,12,.03).slice(0,8),...stats,vibes:vib,
    strength:clamp((pins.length+(closetPal?1:0)+S.wear.length*.2)/4,.3,1),
    sources:{pins:pins.length-photos,photos,items:closetPal?main.length:0,wears:S.wear.length}};
}

/* ---------- outfit photos: match a photo of a look you love to your closet ---------- */
async function analyzeOutfitPhoto(file){
  const bmp=await loadBitmap(file); const photo=await jpegOf(bmp,1200);

  const bspread=Math.sqrt(border.reduce((t,b)=>t+(b[0]-bg[0])**2+(b[1]-bg[1])**2+(b[2]-bg[2])**2,0)/border.length);
  const busy=bspread>14;   /* busy room behind you: don't try to remove the background, the person fills the middle */
  const skin=(L,a,b)=>{ const C=Math.hypot(a,b); let hh=Math.atan2(b,a)*180/Math.PI; if(hh<0) hh+=360; return hh>15&&hh<75&&C>9&&C<40&&L>35&&L<88; };
  const isBgPx=(L,a,b)=>!busy&&Math.hypot(L-bg[0],a-bg[1],b-bg[2])<16;
  const band=(y0,y1,x0,x1)=>{ const pts=[];
    for(let y=Math.floor(y0*H);y<Math.min(H,y1*H);y++) for(let xx=Math.floor(x0*W);xx<Math.min(W,x1*W);xx++){ const [L,a,b]=lab(y*W+xx);
      if(isBgPx(L,a,b)||skin(L,a,b)) continue; pts.push([L,a,b,Math.max(.2,1-Math.abs(xx/W-.5)*1.8)]); }
    return pts.length>30?mergeClusters(kmeans(pts,4),12,.1):[]; };

  if(tops>=4&&bottoms<tops/3) add('Balance','straight','denim',`You have ${tops} tops but only ${bottoms} ${bottoms===1?'bottom':'bottoms'}. A pair of straight jeans multiplies your outfits.`);
  if(bottoms>=4&&tops<bottoms/2) add('Balance','tee','white',`You have more bottoms than tops. A plain white tee pairs with all of them.`);
  const famCount={}; main.forEach(i=>{ const f=pc(i).fam; famCount[f]=(famCount[f]||0)+1; });
  const [domFam,domN]=Object.entries(famCount).sort((a,b)=>b[1]-a[1])[0]||[];
  if(domFam&&domN/main.length>.4&&main.length>=6){ const light=COLOR[domFam]&&colorFromFam(domFam).L<50; add('Color',light?'sweater':'long-sleeve',light?'cream':'black',`Almost half your closet is ${colorWord(domFam)}. A ${light?'cream knit':'black top'} adds contrast and new combinations.`); }
  for(const k of ['university','networking','date','party','formal']){
    const occ=OCC[k]; const best=generate(1,{occ,mild:true,fresh:true,ignoreSeen:true})[0];
    if(best&&best.score>-.5) continue;
    const slots=best?piecesOf(best).map(p=>({slot:p.slot,fit:itemFit(p.it,makeCtx({occ,mild:true,fresh:true}))})).sort((a,b)=>a.fit-b.fit):[{slot:'top'}];
    const weak=slots[0].slot==='outer'?'outer':slots[0].slot;
    const sub=[...occ.preferSet].find(s=>SUB[s]&&CAT[SUB[s].cat].slot===weak)||[...occ.preferSet].find(s=>SUB[s]&&CAT[SUB[s].cat].slot!=='acc');
    if(sub) add(`For ${occ.label.toLowerCase()}`,sub,weak==='shoes'||weak==='bottom'?'black':'cream',`Your closet struggles to dress for ${occ.p}. This would fill the gap.`);
  }
  return out.slice(0,6);
}

/* ---------- journal page ---------- */
function viewJournal(){
  const v=h('section',{class:'view'}); const t=todayISO();
  v.append(h('div',{class:'head'},h('div',{},h('h1',{class:'title'},'Journal'),h('p',{class:'lede'},'What you wore, what you forgot about, and what your closet is missing.'))));
  const month=S.wear.filter(w=>daysBetween(w.date,t)<=30);
  const worn=new Set(month.flatMap(idsOf)).size, main=S.items.filter(i=>slotOf(i)!=='acc');
  v.append(h('div',{class:'stats'},
    h('div',{class:'stat'},h('b',{},String(month.length)),h('span',{},'outfits worn in the last 30 days')),
    h('div',{class:'stat'},h('b',{},S.items.length?Math.round(worn/S.items.length*100)+'%':'0%'),h('span',{},'of your closet worn this month')),
    h('div',{class:'stat'},h('b',{},String(S.items.filter(i=>i.laundry).length)),h('span',{},'pieces in the laundry'))));
  const recent=S.wear.slice().sort((a,b)=>b.date.localeCompare(a.date)||0).slice(0,12);
  v.append(h('div',{class:'jsec'},h('h2',{},'Worn lately'),
    recent.length?h('div',{class:'diary'},recent.map(w=>h('div',{class:'entry'},h('button',{class:'rm','aria-label':'Remove from journal',onclick:()=>removeWear(w)},icon('x')),
      outfitVisual(w,{small:true}),h('div',{class:'d'},fmtDay(w.date)),h('div',{class:'t'},w.title))))
    :h('p',{},'Tap "Wore this today" on any outfit and it shows up here. The stylist uses it to avoid repeats.')));
  const forgotten=main.filter(i=>!i.laundry).map(it=>({it,d:wearInfo(it.id).days})).filter(x=>x.d==null||x.d>=30).sort((a,b)=>(b.d??999)-(a.d??999)||a.it.createdAt-b.it.createdAt).slice(0,10);
  v.append(h('div',{class:'jsec'},h('h2',{},'Forgotten pieces'),h('p',{},'Things you have not worn in a month or more. Give them a turn.'),
    forgotten.length?h('div',{class:'forgot-row'},forgotten.map(({it,d})=>h('div',{class:'forgot'},itemCard(it,openDetail),h('span',{class:'muted',style:{fontSize:'12.5px',textAlign:'center'}},d==null?'Not worn yet':`${d} days ago`),
      h('button',{class:'btn sm',onclick:()=>styleAround(it.id)},'Style it'))))
    :h('p',{class:'muted'},'Nothing forgotten. You are using your whole closet.')));
  const most=[...S.wearIdx.entries()].map(([id,e])=>({it:I(id),n:e.count})).filter(x=>x.it).sort((a,b)=>b.n-a.n).slice(0,6);
  if(most.length) v.append(h('div',{class:'jsec'},h('h2',{},'Most worn'),h('div',{class:'forgot-row'},most.map(({it,n})=>h('div',{class:'forgot'},itemCard(it,openDetail),h('span',{class:'muted',style:{fontSize:'12.5px',textAlign:'center'}},`Worn ${n} ${n===1?'time':'times'}`))))));
  const gaps=closetGaps();
  v.append(h('div',{class:'jsec'},h('h2',{},'Closet gaps'),h('p',{},'Pieces that would unlock the most new outfits, based on what you already own.'),
    gaps.length?h('div',{class:'gaps'},gaps.map(g=>h('div',{class:'gap'},h('small',{},g.tag),h('h3',{},g.v.name),h('p',{},g.why),g.n?h('div',{class:'un'},`Goes with ${g.n} of your pieces`):null)))
    :h('p',{class:'muted'},main.length<3?'Add a few more pieces and suggestions appear here.':'No obvious gaps. Your closet covers every occasion.')));
  return v;
}
function styleAround(id){ const g=S.gen; g.mode='today'; g.anchor=id; g.queue=[]; g.selected=null; S.view='outfits'; if(window.matchMedia('(max-width: 899px)').matches) g.collapsed=true; nextOutfit(); }

/* ---------- backup and settings ---------- */
const blobToData=b=>new Promise(r=>{ const fr=new FileReader(); fr.onload=()=>r(fr.result); fr.readAsDataURL(b); });
const dataToBlob=async d=>(await fetch(d)).blob();
async function exportBackup(){
  toast('Preparing your backup…');
  const keys=await DB.keys('images'); const images={}; for(const k of keys){ const b=await DB.get('images',k); if(b) images[k]=await blobToData(b); }
  const data={app:'closet',version:2,exportedAt:new Date().toISOString(),items:S.items,liked:S.liked,pins:S.pins,wear:S.wear,settings:{profileUse:S.profileUse,myVibes:S.myVibes,learn:S.learn,look:S.look,plan:S.plan,trip:S.trip},images};
  const blob=new Blob([JSON.stringify(data)],{type:'application/json'}); const a=h('a',{href:URL.createObjectURL(blob),download:`closet-backup-${new Date().toISOString().slice(0,10)}.json`});
  document.body.append(a); a.click(); setTimeout(()=>{ URL.revokeObjectURL(a.href); a.remove(); },1000);
}
async function importBackup(file){
  try{
    const d=JSON.parse(await file.text()); if(d.app!=='closet') throw new Error('Not a closet backup');
    toast('Restoring…');
    for(const [k,v] of Object.entries(d.images||{})){ const b=await dataToBlob(v); await DB.put('images',k,b); if(!IMG.urls.has(k)) IMG.urls.set(k,URL.createObjectURL(b)); }
    for(const it of d.items||[]){ await DB.put('items',it.id,it); if(!I(it.id)) S.items.push(it); }
    for(const l of d.liked||[]){ await DB.put('liked',l.id,l); if(!S.liked.some(x=>x.id===l.id)) S.liked.push(l); }
    for(const p of d.pins||[]){ await DB.put('pins',p.id,p); if(!S.pins.some(x=>x.id===p.id)) S.pins.push(p); }
    for(const w of d.wear||[]){ await DB.put('wear',w.id,w); if(!S.wear.some(x=>x.id===w.id)) S.wear.push(w); } rebuildWearIdx();
    if(d.settings){ if(!S.plan&&d.settings.plan) S.plan=d.settings.plan; if(!S.trip&&d.settings.trip) S.trip=d.settings.trip; }
    if(d.settings){ S.myVibes=[...new Set([...S.myVibes,...(d.settings.myVibes||[])])]; const L=d.settings.learn||{}; for(const [k,v] of Object.entries(L.pairs||{})) S.learn.pairs[k]=v; for(const [k,v] of Object.entries(L.items||{})) S.learn.items[k]=v; await saveMeta(); }
    toast(`Restored ${(d.items||[]).length} pieces, ${(d.pins||[]).length} pins and ${(d.liked||[]).length} liked outfits`); document.querySelector('.back')?.remove(); render();
  }catch(e){ console.warn(e); toast("That file isn't a closet backup."); }
}
function openSettings(){
  const fileIn=h('input',{type:'file',accept:'application/json,.json',class:'sr',onchange:e=>{ if(e.target.files[0]) importBackup(e.target.files[0]); }});
  openModal(h('div',{},h('div',{class:'modal-head'},h('h2',{},'Settings')),h('div',{class:'modal-body',style:{display:'grid',gap:'20px'}},
    h('div',{},h('h3',{style:{fontSize:'24px',fontStyle:'italic',fontWeight:500,marginBottom:'10px'}},'Color theme'),paletteSection()),

      h('p',{class:'muted',style:{margin:'0 0 12px'}},'Everything is saved privately in this browser. To move your closet to another device, tap Download backup here, send the file to that device, then open these settings there and tap Restore from backup.'),
      h('div',{style:{display:'flex',gap:'10px',flexWrap:'wrap'}},h('button',{class:'btn primary',onclick:exportBackup},'Download backup'),h('label',{class:'btn'},fileIn,'Restore from backup'))),
    (()=>{ const todo=S.items.filter(i=>!i.polished&&i.cutout&&i.img&&i.img!==i.photo).length; const b=h('button',{class:'btn',disabled:!todo,onclick:e=>polishCloset(e.currentTarget)},todo?`Polish ${todo} ${todo===1?'photo':'photos'}`:'All photos polished');
      return h('div',{},h('h3',{style:{fontSize:'20px',fontStyle:'italic',fontWeight:400,marginBottom:'6px'}},'Polish my existing photos'),
        h('p',{class:'muted',style:{margin:'0 0 12px'}},'Gives pieces you added earlier truer colors, smoother edges and a straight, even frame. Cutouts you fixed by hand are kept.'),b); })(),
    h('div',{},h('h3',{style:{fontSize:'20px',fontStyle:'italic',fontWeight:400,marginBottom:'6px'}},'What the stylist has learned'),
      h('p',{class:'muted',style:{margin:'0 0 12px'}},`${Object.keys(S.learn.pairs).length} pairings remembered from your likes, choices and passes.`),
      h('button',{class:'btn',onclick:()=>{ S.learn={pairs:{},items:{}}; saveMeta(); toast('The stylist starts fresh'); }},'Reset what it learned')),
    h('div',{class:'foot',style:{borderTop:'1px solid var(--line)'}},h('span',{class:'muted'},`Signed in as ${S.userName}`),h('button',{class:'btn',onclick:signOut},'Sign out')))),{size:'narrow'});
}
